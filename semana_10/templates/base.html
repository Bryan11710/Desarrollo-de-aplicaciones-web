<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CeluStore{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav style="background: #333; padding: 10px; color: white;">
        <a href="{{ url_for('index') }}" style="color: white;">Inicio</a> | 
        <a href="{{ url_for('celulares') }}" style="color: white;">Celulares</a> |
        <a href="{{ url_for('about') }}" style="color: white;">Nosotros</a>
    </nav>

    <div style="padding: 20px;">
        {% block content %}
        <h1>Si ves esto, el bloque content está vacío</h1>
        {% endblock %}
    </div>

    <footer style="margin-top: 20px; border-top: 1px solid #ccc;">
        <p>Semana 10 - 2026</p>
    </footer>
</body>
</html>
