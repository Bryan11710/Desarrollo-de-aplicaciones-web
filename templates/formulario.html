{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1 class="titulo-grande">REGISTRO DE NUEVO EQUIPO</h1>
    <p>INGRESE LOS DETALLES TÉCNICOS DEL DISPOSITIVO.</p>

    <form action="/agregar" method="POST" style="text-align: left; margin-top: 20px;">
        <div style="margin-bottom: 15px;">
            <label><strong>MARCA DEL CELULAR:</strong></label><br>
            <input type="text" name="marca" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #d2d2d7;">
        </div>

        <div style="margin-bottom: 15px;">
            <label><strong>MODELO / NOMBRE:</strong></label><br>
            <input type="text" name="nombre" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #d2d2d7;">
        </div>

        <div style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label><strong>CANTIDAD:</strong></label><br>
                <input type="number" name="cantidad" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #d2d2d7;">
            </div>
            <div style="flex: 1;">
                <label><strong>PRECIO ($):</strong></label><br>
                <input type="step" name="precio" step="0.01" required style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #d2d2d7;">
            </div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button type="submit" class="btn" style="border: none; cursor: pointer; width: 200px;">
                <strong>GUARDAR EQUIPO</strong>
            </button>
        </div>
    </form>
</div>
{% endblock %}
