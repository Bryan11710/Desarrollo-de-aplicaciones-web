<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Semana 08</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Mi Web</a>
            <div class="navbar-nav">
                <a class="nav-link" href="#">Inicio</a>
                <a class="nav-link" href="#">Productos</a>
                <a class="nav-link" href="#">Contacto</a>
            </div>
        </div>
    </nav>

    <div id="miCarrusel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/id/10/1200/400" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/id/20/1200/400" class="d-block w-100">
            </div>
        </div>
    </div>

    <div class="container mt-4">
        <button id="miBoton" class="btn btn-danger mb-4">Haz clic aquí</button>

        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Teclado</td>
                    <td>$20</td>
                </tr>
            </tbody>
        </table>

        <form id="miFormulario" class="mt-4 border p-3">
            <h3>Contacto</h3>
            <input type="text" id="nombre" class="form-control mb-2" placeholder="Tu nombre" required>
            <input type="email" id="correo" class="form-control mb-2" placeholder="Tu correo" required>
            <textarea id="mensaje" class="form-control mb-2" placeholder="Mensaje" required></textarea>
            <button type="submit" class="btn btn-success">Enviar</button>
        </form>
    </div>

    <footer class="text-center p-3 mt-4 bg-light">
        <p>Contacto: bryan77@hotmail.com</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
