<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechNova | Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff; /* Blanco total */
            color: #111111;
            margin: 0;
            padding: 0;
        }

        /* Navegación ultra minimalista */
        .navbar {
            background-color: #ffffff !important;
            border-bottom: 1px solid #eaeaea; /* Línea muy fina */
            padding: 20px 0;
        }

        .navbar-brand {
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
            color: #000 !important;
        }

        .nav-link {
            color: #666 !important;
            font-size: 0.9rem;
            font-weight: 400;
            margin-left: 25px;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #000 !important;
        }

        /* El botón de registros ahora es un link elegante */
        .nav-logs {
            color: #007bff !important; /* Un toque de azul solo aquí */
            font-weight: 500;
        }

        .main-container {
            margin-top: 60px;
        }

        /* Footer discreto */
        footer {
            margin-top: 100px;
            padding: 40px 0;
            border-top: 1px solid #eaeaea;
            color: #999;
            font-size: 0.8rem;
            text-align: center;
        }

        /* Quitar sombras y bordes feos de las tablas/cuadros que vengan de otros archivos */
        .card, .table {
            border: 1px solid #eee !important;
            box-shadow: none !important;
            background: #fff !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">TECHNOVA</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('listar') }}">Inventario</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('agregar_equipo') }}">Añadir</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-logs" href="{{ url_for('ver_archivos') }}">Registros</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container main-container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <div class="container">
            <p>© 2026 TechNova Systems. Minimalist Inventory Management.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
