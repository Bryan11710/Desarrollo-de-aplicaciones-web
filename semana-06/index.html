<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Dinámico - Semana 6</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <h2>Registro de Usuario</h2>
        <form id="registroForm">
            <div class="group">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" placeholder="Mínimo 3 letras">
                <p class="error-msg" id="error-nombre"></p>
            </div>

            <div class="group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" placeholder="correo@ejemplo.com">
                <p class="error-msg" id="error-email"></p>
            </div>

            <div class="group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="8+ caracteres, 1 número y 1 símbolo">
                <p class="error-msg" id="error-password"></p>
            </div>

            <div class="group">
                <label for="confirmPassword">Confirmar Contraseña:</label>
                <input type="password" id="confirmPassword">
                <p class="error-msg" id="error-confirm"></p>
            </div>

            <div class="group">
                <label for="edad">Edad:</label>
                <input type="number" id="edad" placeholder="Mínimo 18 años">
                <p class="error-msg" id="error-edad"></p>
            </div>

            <div class="actions">
                <button type="submit" id="btnSubmit" disabled>Enviar Registro</button>
                <button type="reset" id="btnReset">Reiniciar</button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
