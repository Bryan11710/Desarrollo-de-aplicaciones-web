<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iStore | Inventario Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-gray: #f5f5f7;
            --apple-blue: #0066cc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: var(--apple-black);
            -webkit-font-smoothing: antialiased;
        }

        /* Navbar estilo Apple (Blur y Transparencia) */
        .navbar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--apple-black) !important;
        }

        .nav-link {
            color: var(--apple-black) !important;
            font-size: 0.9rem;
            font-weight: 400;
            margin: 0 15px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .nav-link:hover {
            opacity: 1;
            color: var(--apple-blue) !important;
        }

        /* Botón especial para la tarea */
        .nav-task {
            background-color: var(--apple-black);
            color: white !important;
            border-radius: 20px;
            padding: 5px 15px !important;
            font-size: 0.8rem;
        }

        /* Contenedor Principal */
        .main-container {
            margin-top: 50px;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cards estilo Apple */
        .card {
            border: none;
            border-radius: 20px;
            background: var(--apple-gray);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.02);
        }

        footer {
            background-color: var(--apple-gray);
            padding: 40px 0;
            margin-top: 100px;
            font-size: 0.8rem;
            color: #86868b;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fab fa-apple"></i> iStore
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('listar') }}">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('agregar_equipo') }}">Añadir</a></li>
                    <li class="nav-item">
                        <a class="nav-link nav-task" href="{{ url_for('ver_archivos') }}">
                             <i class="fas fa-archive"></i> Datos Semana 12
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container main-container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <div class="container text-center">
            <p>Copyright © 2026 iStore Inc. Todos los derechos reservados.</p>
            <p>Proyecto desarrollado por Bryan | Persistencia de Datos</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
